<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - Swimmo Malang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandPink: '#FF4D8D', brandPinkHover: '#E03B75', brandAqua: '#00B4D8' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brandPink to-brandAqua text-white font-black text-3xl flex items-center justify-center mx-auto mb-4 shadow-md">S</div>
            <h1 class="text-2xl font-extrabold text-slate-900">Portal Internal Swimmo</h1>
            <p class="text-slate-500 text-xs mt-1">Pilih akun akses cepat untuk simulasi peran</p>
        </div>

        <!-- Quick Role Selector untuk Demo -->
        <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-100 p-1.5 rounded-xl">
            <button type="button" onclick="fillDemo('owner')" class="text-xs font-bold py-2 px-3 rounded-lg bg-white shadow-sm text-brandPink">
                Akun Owner / Admin
            </button>
            <button type="button" onclick="fillDemo('coach')" class="text-xs font-bold py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900">
                Akun Coach Rizal
            </button>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Akun</label>
                <input type="email" id="loginEmail" value="admin@swimmo.mlg" required class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-brandPink">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="loginPassword" value="swimmo123" required class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-brandPink">
            </div>

            <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200">
                Akun tidak ditemukan! Gunakan tombol akun demo di atas.
            </div>

            <button type="submit" class="w-full bg-brandPink hover:bg-brandPinkHover text-white font-bold py-3.5 rounded-xl shadow-lg shadow-pink-200 transition-all flex items-center justify-center gap-2">
                <span>Masuk ke Sistem</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-brandAqua inline-flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Web Customer
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const users = {
            'admin@swimmo.mlg': { pass: 'swimmo123', role: 'owner', name: 'Owner Swimmo' },
            'rizal@swimmo.mlg': { pass: 'coach123', role: 'coach', name: 'Coach Rizal' },
            'dimas@swimmo.mlg': { pass: 'coach123', role: 'coach', name: 'Coach Dimas' }
        };

        function fillDemo(type) {
            if (type === 'owner') {
                document.getElementById('loginEmail').value = 'admin@swimmo.mlg';
                document.getElementById('loginPassword').value = 'swimmo123';
            } else {
                document.getElementById('loginEmail').value = 'rizal@swimmo.mlg';
                document.getElementById('loginPassword').value = 'coach123';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.toLowerCase();
            const pass = document.getElementById('loginPassword').value;

            if (users[email] && users[email].pass === pass) {
                localStorage.setItem('swimmo_session', JSON.stringify(users[email]));
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
