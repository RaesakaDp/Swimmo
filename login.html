<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Swimmo Malang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPink: '#FF4D8D',
                        brandPinkHover: '#E03B75',
                        brandAqua: '#00B4D8',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brandPink to-brandAqua text-white font-black text-3xl flex items-center justify-center mx-auto mb-4 shadow-md">
                S
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Portal Internal Swimmo</h1>
            <p class="text-slate-500 text-sm mt-1">Masuk untuk mengelola siswa, jadwal & presensi</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Admin / Pelatih</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5"></i>
                    <input type="email" id="loginEmail" value="admin@swimmo.mlg" required class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brandPink">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="loginPassword" value="swimmo123" required class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brandPink">
                </div>
            </div>

            <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200">
                Email atau password salah! Gunakan default: <b>admin@swimmo.mlg</b> / <b>swimmo123</b>
            </div>

            <button type="submit" class="w-full bg-brandPink hover:bg-brandPinkHover text-white font-bold py-3.5 rounded-xl shadow-lg shadow-pink-200 transition-all flex items-center justify-center gap-2">
                <span>Masuk ke Dashboard</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-brandAqua flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Halaman Utama Customer
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Cek jika sudah login sebelumnya
        if (localStorage.getItem('swimmo_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            if (email === 'admin@swimmo.mlg' && pass === 'swimmo123') {
                localStorage.setItem('swimmo_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
